# ============================================================================
# ChessWithDSH —— DSH bundle patch
# ============================================================================
# 这是插件的"挂载声明"。DSH 启动时按 bundle 层栈叠加各插件 patch，
# 本文件把插件插入 profile 的配置树。
#
# 安装（本地开发用 link，不需要发布到 npm）：
#   dsh plugin --profile web add link:<本仓库绝对路径>
#
# 参考形态：本机已装的 dsh-whale-widget 用的就是同一套写法。
# 注意：这里的 name 是**包名**（node_modules 里能解析到的那个），
# 不是 lib/index.js 里导出的插件 name。
# ============================================================================

- insert:
    - id: chesswithdsh
      name: chesswithdsh
